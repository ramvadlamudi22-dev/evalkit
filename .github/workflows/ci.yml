name: ci

on:
  push:
    branches: [main, bootstrap-init]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.9"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Pytest
        run: uv run pytest

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  audit:
    name: audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: pip-audit
        # `--skip-editable` prevents pip-audit from looking up the local editable install
        # of evalkit on PyPI (it isn't published from CI). We do not pass `--strict` because
        # pip-audit treats a skipped editable install as a strict-mode failure; the audit
        # still fails the job on any actual CVE.
        run: uv run pip-audit --skip-editable

  docker:
    name: docker (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: evalkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm evalkit:ci --version
          docker run --rm evalkit:ci --help

      - name: Image size
        run: |
          docker image inspect evalkit:ci --format '{{.Size}}' \
            | awk '{ printf "image size: %.1f MB\n", $1/1024/1024 }'

  e2e-cli:
    name: e2e-cli (installed wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build wheel
        run: |
          uv build --wheel
          ls -la dist/

      - name: Install wheel into a fresh venv
        run: |
          uv venv /tmp/freshvenv
          /tmp/freshvenv/bin/pip install dist/*.whl

      - name: Smoke test installed CLI
        run: |
          /tmp/freshvenv/bin/evalkit --version
          /tmp/freshvenv/bin/evalkit --help
