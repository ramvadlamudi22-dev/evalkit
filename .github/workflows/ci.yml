name: ci

on:
  push:
    branches: [main, bootstrap-init]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.9"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Pytest
        run: uv run pytest

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  audit:
    name: audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: pip-audit
        # `--skip-editable` prevents pip-audit from looking up the local editable install
        # of evalkit on PyPI (it isn't published from CI). We do not pass `--strict` because
        # pip-audit treats a skipped editable install as a strict-mode failure; the audit
        # still fails the job on any actual CVE.
        #
        # Ignored CVEs (LiteLLM proxy-server only; we use LiteLLM as a library
        # and never run `litellm-proxy`):
        #   CVE-2026-42203  proxy /prompts/test SSTI
        #   CVE-2026-42208  proxy combined-view token SQL injection
        #   CVE-2026-42271  proxy /v1/messages auth bypass
        #   CVE-2026-40217  proxy management routes
        # Newer LiteLLM (>=1.83.10) pins click==8.1.8 exactly, which conflicts
        # with our Typer 0.25 constraint (Typer 0.25 needs click>=8.2.1). We
        # revisit when LiteLLM relaxes the click pin or our Typer constraint
        # changes; tracked in ADR-0004.
        run: |
          uv run pip-audit --skip-editable \
            --ignore-vuln CVE-2026-42203 \
            --ignore-vuln CVE-2026-42208 \
            --ignore-vuln CVE-2026-42271 \
            --ignore-vuln CVE-2026-40217

  docker:
    name: docker (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: evalkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm evalkit:ci --version
          docker run --rm evalkit:ci --help

      - name: Image size
        run: |
          docker image inspect evalkit:ci --format '{{.Size}}' \
            | awk '{ printf "image size: %.1f MB\n", $1/1024/1024 }'

  e2e-cli:
    name: e2e-cli (installed wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build wheel
        run: |
          uv build --wheel
          ls -la dist/

      - name: Install wheel into a fresh venv
        # `uv venv` does not seed pip by default; we use `uv pip install --python ...`
        # to install the wheel into the freshly created venv without needing pip inside it.
        run: |
          uv venv /tmp/freshvenv
          uv pip install --python /tmp/freshvenv/bin/python dist/*.whl

      - name: Smoke test installed CLI
        run: |
          /tmp/freshvenv/bin/evalkit --version
          /tmp/freshvenv/bin/evalkit --help

      - name: End-to-end run (mock provider)
        # Drives the full Phase 1 flow against the wheel-installed CLI: scaffold a
        # starter project, execute the suite, list the resulting run, and dump it.
        run: |
          /tmp/freshvenv/bin/evalkit init /tmp/demo
          /tmp/freshvenv/bin/evalkit run /tmp/demo/suite.yaml --db /tmp/demo/evalkit.db
          /tmp/freshvenv/bin/evalkit list runs --db /tmp/demo/evalkit.db
          RUN_ID=$(/tmp/freshvenv/bin/evalkit list runs --db /tmp/demo/evalkit.db --limit 1 \
            | awk '{print $1}')
          /tmp/freshvenv/bin/evalkit show "$RUN_ID" --db /tmp/demo/evalkit.db
