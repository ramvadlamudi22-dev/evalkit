[project]
name = "evalkit"
version = "0.0.1"
description = "A pytest-shaped LLM evaluation toolkit: declarative suites, reproducible runs, regression gates, OpenTelemetry-ready."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Ram Vadlamudi" }]
keywords = ["llm", "evaluation", "cli", "pytest-friendly", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.25.1,<1.0",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-ulid>=2,<4",
    "structlog>=24,<26",
    "tenacity>=9,<10",
    "litellm>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.15.12,<1.0",
    "mypy>=2.0.0,<3.0",
    "pre-commit>=4.6.0,<5.0",
    "pip-audit>=2.10.0,<3.0",
    "types-pyyaml>=6,<7",
]

[project.scripts]
evalkit = "evalkit.cli:app"

[project.urls]
Homepage = "https://github.com/ramvadlamudi22-dev/evalkit"
Repository = "https://github.com/ramvadlamudi22-dev/evalkit"
Issues = "https://github.com/ramvadlamudi22-dev/evalkit/issues"
Changelog = "https://github.com/ramvadlamudi22-dev/evalkit/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/evalkit",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/architecture"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # bandit (security)
    "BLE",  # blind-except
    "T20",  # flake8-print
    "C90",  # mccabe complexity
    "TID",  # tidy-imports
    "TD",   # todos
    "FIX",  # flake8-fixme
    "RUF",  # ruff-specific
]
ignore = [
    "TD002",  # missing author in TODO  (we forbid TODOs entirely; codified separately)
    "TD003",  # missing link in TODO
]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are expected in tests.
# S603: subprocess.run is invoked with literal argument lists, not user input.
"tests/**/*.py" = ["S101", "S603"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_unimported = true
files = ["src", "tests"]
exclude = ["docs/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=evalkit",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests touching multiple components",
    "e2e: end-to-end CLI tests via subprocess",
    "real_providers: tests calling real LLM providers; opt-in via EVALKIT_TEST_REAL_PROVIDERS=1",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/evalkit"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
skip_empty = true
